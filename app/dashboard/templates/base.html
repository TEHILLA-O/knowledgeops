<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}KnowledgeOps{% endblock %}</title>
    <style>
        :root {
            --bg: #0f1419;
            --surface: #1a2332;
            --border: #2d3a4f;
            --text: #e7ecf3;
            --muted: #8b9cb3;
            --accent: #3b82f6;
            --success: #22c55e;
            --warning: #f59e0b;
            --danger: #ef4444;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: var(--bg);
            color: var(--text);
            line-height: 1.5;
            min-height: 100vh;
        }
        nav {
            background: var(--surface);
            border-bottom: 1px solid var(--border);
            padding: 1rem 2rem;
            display: flex;
            align-items: center;
            gap: 2rem;
        }
        nav .brand { font-weight: 700; font-size: 1.1rem; color: var(--accent); }
        nav a {
            color: var(--muted);
            text-decoration: none;
            font-size: 0.9rem;
        }
        nav a:hover, nav a.active { color: var(--text); }
        main { max-width: 1280px; margin: 0 auto; padding: 2rem; }
        h1 { font-size: 1.75rem; margin-bottom: 0.5rem; }
        h2 { font-size: 1.25rem; margin: 1.5rem 0 1rem; color: var(--muted); }
        .subtitle { color: var(--muted); margin-bottom: 2rem; }
        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 1rem;
            margin-bottom: 2rem;
        }
        .card {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 1.25rem;
        }
        .card .label { font-size: 0.8rem; color: var(--muted); text-transform: uppercase; letter-spacing: 0.05em; }
        .card .value { font-size: 2rem; font-weight: 700; margin-top: 0.25rem; }
        .card .value.small { font-size: 1.25rem; }
        table {
            width: 100%;
            border-collapse: collapse;
            background: var(--surface);
            border-radius: 8px;
            overflow: hidden;
            border: 1px solid var(--border);
        }
        th, td {
            padding: 0.75rem 1rem;
            text-align: left;
            border-bottom: 1px solid var(--border);
            font-size: 0.9rem;
        }
        th { background: rgba(0,0,0,0.2); color: var(--muted); font-weight: 600; }
        tr:last-child td { border-bottom: none; }
        tr:hover td { background: rgba(59,130,246,0.05); }
        .badge {
            display: inline-block;
            padding: 0.15rem 0.5rem;
            border-radius: 4px;
            font-size: 0.75rem;
            font-weight: 600;
        }
        .badge-success { background: rgba(34,197,94,0.2); color: var(--success); }
        .badge-warning { background: rgba(245,158,11,0.2); color: var(--warning); }
        .badge-danger { background: rgba(239,68,68,0.2); color: var(--danger); }
        .badge-info { background: rgba(59,130,246,0.2); color: var(--accent); }
        form { margin-bottom: 1.5rem; }
        input, textarea, select, button {
            font-family: inherit;
            font-size: 0.9rem;
        }
        input[type="text"], textarea, select {
            background: var(--bg);
            border: 1px solid var(--border);
            color: var(--text);
            padding: 0.6rem 0.8rem;
            border-radius: 6px;
            width: 100%;
        }
        button, .btn {
            background: var(--accent);
            color: white;
            border: none;
            padding: 0.6rem 1.2rem;
            border-radius: 6px;
            cursor: pointer;
            text-decoration: none;
            display: inline-block;
            font-size: 0.9rem;
        }
        button:hover, .btn:hover { opacity: 0.9; }
        .form-row { display: flex; gap: 0.75rem; align-items: flex-end; }
        .form-row input { flex: 1; }
        .chunk-card {
            background: var(--bg);
            border: 1px solid var(--border);
            border-radius: 6px;
            padding: 1rem;
            margin-bottom: 0.75rem;
        }
        .chunk-card .score { color: var(--accent); font-weight: 600; font-size: 0.85rem; }
        .chunk-card .meta { color: var(--muted); font-size: 0.8rem; margin: 0.25rem 0; }
        .chunk-card .content { font-size: 0.9rem; margin-top: 0.5rem; }
        .empty { color: var(--muted); text-align: center; padding: 2rem; }
        .pagination { display: flex; gap: 0.5rem; margin-top: 1rem; }
        .pagination a {
            color: var(--accent);
            text-decoration: none;
            padding: 0.25rem 0.5rem;
        }
    </style>
    {% block extra_head %}{% endblock %}
</head>
<body>
    <nav>
        <span class="brand">KnowledgeOps</span>
        <a href="/dashboard" {% if active == 'dashboard' %}class="active"{% endif %}>Dashboard</a>
        <a href="/dashboard/debug" {% if active == 'debug' %}class="active"{% endif %}>Retrieval Debug</a>
        <a href="/docs" target="_blank">API Docs</a>
    </nav>
    <main>
        {% block content %}{% endblock %}
    </main>
</body>
</html>
