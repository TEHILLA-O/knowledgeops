[project]
name = "knowledgeops-rag-platform"
version = "0.1.0"
description = "Self-maintaining RAG knowledge automation platform"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "KnowledgeOps Team" }]
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "pydantic>=2.10.0",
    "pydantic-settings>=2.6.0",
    "sqlalchemy[asyncio]>=2.0.36",
    "asyncpg>=0.30.0",
    "alembic>=1.14.0",
    "qdrant-client>=1.12.0",
    "httpx>=0.28.0",
    "beautifulsoup4>=4.12.0",
    "lxml>=5.3.0",
    "pymupdf>=1.24.0",
    "python-docx>=1.1.0",
    "markdown>=3.7",
    "sentence-transformers>=3.3.0",
    "rank-bm25>=0.2.2",
    "numpy>=2.1.0",
    "prefect>=3.1.0",
    "structlog>=24.4.0",
    "tenacity>=9.0.0",
    "pyyaml>=6.0.2",
    "jinja2>=3.1.4",
    "python-multipart>=0.0.17",
    "tiktoken>=0.8.0",
    "ragas>=0.2.0",
    "typer[all]>=0.14.0",
    "rich>=13.9.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=6.0.0",
    "ruff>=0.8.0",
    "mypy>=1.13.0",
    "types-pyyaml",
    "types-markdown",
    "aiosqlite>=0.20.0",
    "httpx>=0.28.0",
]

[project.scripts]
knowledgeops = "app.cli.main:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "ASYNC"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"app/api/**" = ["B008"]
"app/dashboard/**" = ["B008"]
"app/cli/**" = ["B008"]
"app/generation/prompts.py" = ["E501"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["tests.*"]
disallow_untyped_defs = false

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
markers = [
    "integration: integration tests requiring services",
    "e2e: end-to-end tests",
]

[tool.coverage.run]
source = ["app"]
omit = ["app/cli/*"]
